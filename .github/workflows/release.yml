name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgirepository1.0-dev gir1.2-webkit2-4.1 python3-gi dpkg

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller pillow

      - name: Build
        run: python -m PyInstaller build/mobilecad-recorder.spec --noconfirm --distpath dist --workpath build/work

      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/dmg
          cp -R "dist/安卓平板录屏助手.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "安卓平板录屏助手" -srcfolder dist/dmg -ov -format UDZO "/tmp/TabletRecorder-macOS.dmg"
          cp "/tmp/TabletRecorder-macOS.dmg" "dist/TabletRecorder-macOS.dmg"

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "build\installer.iss"

      - name: Package (Linux deb + tar.gz)
        if: runner.os == 'Linux'
        run: |
          bash build/linux-deb.sh
          tar -czf "dist/TabletRecorder-Linux.tar.gz" -C dist TabletRecorder

      - uses: actions/upload-artifact@v4
        with:
          name: TabletRecorder-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p files
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} files/ \;
          ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
