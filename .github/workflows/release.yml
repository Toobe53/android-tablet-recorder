name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgirepository1.0-dev gir1.2-webkit2-4.1 python3-gi

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller

      - name: Build
        run: python -m PyInstaller build/mobilecad-recorder.spec --noconfirm --distpath dist --workpath build/work

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/MobileCAD Recorder.app" "MobileCAD-Recorder-macOS.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/MobileCAD Recorder/*" -DestinationPath "MobileCAD-Recorder-Windows.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p pkg
          cp -R "dist/MobileCAD Recorder" pkg/MobileCAD-Recorder
          cp build/icon-256.png pkg/MobileCAD-Recorder.png
          cat > pkg/MobileCAD-Recorder.desktop <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=MobileCAD Recorder
          Comment=adb + scrcpy + ffmpeg recording workbench
          Exec=MobileCAD-Recorder/MobileCAD-Recorder
          Icon=MobileCAD-Recorder.png
          Terminal=false
          Categories=AudioVideo;Recorder;
          DESK
          tar -czf "MobileCAD-Recorder-Linux.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v4
        with:
          name: MobileCAD-Recorder-${{ matrix.name }}
          path: |
            MobileCAD-Recorder-*.zip
            MobileCAD-Recorder-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} files/ \;
          ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
